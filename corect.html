<!DOCTYPE html>
<meta charset="utf-8">

<html>
   
    <body>
        <h2>Corectare text</h2>
        <p>Încarcă fișier: </p>
        <input type="file" id="fileInput" />
        <p>Introducere text: </p>
        <textarea id="introdus" rows="9" maxRows="44" placeholder="Introducere text…" style="width:100%;"></textarea>
        <button type="button" onclick="corectare()">Corectează</button>
        <p>Textul corectat: </p>
        <textarea id="corectat" rows="9" maxRows="44" placeholder="Textul corectat…" style="width:100%;"></textarea>
        <button onclick="downloadFile()">Descarcă fișier</button>  
        <p>Modificări</p>
        <textarea id="modificari" rows="9" maxRows="44" placeholder="Modificări" style="width:100%;"></textarea>  
      
    <script>
    
    function corectare(text) {
        if (!text) {
            text = document.getElementById("introdus").value;
            textcorectat = diacritice(text);
            document.getElementById("corectat").value = textcorectat;
            document.getElementById("modificari").value = modificari(text, textcorectat);
        }
    }
    
    function diacritice(s) {
        
        s = s.trim();
        while (s.includes('  ')) {
            s = s.replace(/  /g, ' ');
        }
        
        s = s.replace(/ \n/g, '\n');
        
        s = s.replace(/Ã/g, 'Ă');
        s = s.replace(/ã/g, 'ă');
        s = s.replace(/ª/g, 'Ș');
        s = s.replace(/º/g, 'ș');
        s = s.replace(/Þ/g, 'Ț');
        s = s.replace(/þ/g, 'ț');
        
        s = s.replace(/\u00c3/g, 'Ă');
        s = s.replace(/\u00e3/g, 'ă');
        s = s.replace(/\u015e/g, 'Ș');
        s = s.replace(/\u015f/g, 'ș');
        s = s.replace(/\u0162/g, 'Ț');
        s = s.replace(/\u0163/g, 'ț');
        
        s = s.replace(/  /g, ' ');
        s = s.replace(/\.{3}/g, '…');
        s = s.replace(/ \./g, '.');
        s = s.replace(/ :/g, ':');
        s = s.replace(/ ,/g, ',');
        s = s.replace(/ ;/g, ';');
        s = s.replace(/ !/g, '!');
        s = s.replace(/ \?/g, '?');
        s = s.replace(//g, ' ');
        
        return(s);
    }

    function modificari(a, b) {

        const lines1 = a.split(/\r?\n/);
        const lines2 = b.split(/\r?\n/);

        m = '';
        let c = 1;
        for (let i = 0; i < lines1.length; i++) {
            if (lines1[i] !== lines2[i]) {
                c = c + 1;
                m = m + " - Linia " + i + 1 + '. -\n';
                m = m + lines1[i] + '\n';
                m = m + lines2[i] + '\n\n';
            }
        }

        if (c > 0) {
            console.log('Modificări la ', c, ' linii.');
        }

        return m;
    }

    </script>

    <script>
        document.getElementById('fileInput')
            .addEventListener('change', (event) => {
                const file = event.target.files[0];
                const filename = file.name;
                const reader = new FileReader();

                reader.onload = function () {
                    const content = reader.result;
                    console.log(content);
                    document.getElementById("introdus").value = content + filename;
                };

                reader.onerror = function () {
                    console.error('Error reading the file');
                };

                reader.readAsText(file, 'utf-8');

                localStorage.setItem("filename", filename);
            });
    </script>

    <script>
        const downloadFile = () => {
            const link = document.createElement("a");
            const content = document.getElementById("corectat").value;
         
            if (!content.trim()) {
                // alert("Please enter some content!");
                return;
            }
         
            const file = new Blob([content], { type: 'text/plain' });
            link.href = URL.createObjectURL(file);
            name = localStorage.getItem("filename")
            link.download = name;
            link.click();
            URL.revokeObjectURL(link.href);
        };
    </script>
    </body>
</html>
