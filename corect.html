<!DOCTYPE html>
<meta charset="utf-8">

<html>
   
    <body>
        <h1>Corectare text</h1>
        <textarea id="introdus" rows="9" maxRows="44"
      placeholder="Introducere text…" style="width:100%;"></textarea>
    <button type="button" onclick="corectare()">Corectează</button>
    
<textarea id="corectat" rows="9" maxRows="44"
      placeholder="Textul corectat…" style="width:100%;"></textarea>  
        <h4>Modificări</h4>
<textarea id="modificari" rows="9" maxRows="44"
      placeholder="Modificări" style="width:100%;"></textarea>  
      
    <script>
    
    function corectare(text) {
      if (!text) {
        text = document.getElementById("introdus").value;
        textcorectat = diacritice(text);
        document.getElementById("corectat").value = textcorectat;
        document.getElementById("modificari").value = modificari(text, textcorectat);
      }
    }
    
    function diacritice(s) {
        
        s = s.trim();
        while (s.includes('  ')) {
            s = s.replace(/  /g, ' ');
        }
        
        s = s.replace(/ \n/g, '\n');
        
        s = s.replace(/Ã/g, 'Ă');
        s = s.replace(/ã/g, 'ă');
        s = s.replace(/ª/g, 'Ș');
        s = s.replace(/º/g, 'ș');
        s = s.replace(/Þ/g, 'Ț');
        s = s.replace(/þ/g, 'ț');
        
        s = s.replace(/\u00c3/g, 'Ă');
        s = s.replace(/\u00e3/g, 'ă');
        s = s.replace(/\u015e/g, 'Ș');
        s = s.replace(/\u015f/g, 'ș');
        s = s.replace(/\u0162/g, 'Ț');
        s = s.replace(/\u0163/g, 'ț');
        
        s = s.replace(/  /g, ' ');
        s = s.replace(/\.{3}/g, '…');
        s = s.replace(/ \./g, '.');
        s = s.replace(/ :/g, ':');
        s = s.replace(/ ,/g, ',');
        s = s.replace(/ ;/g, ';');
        s = s.replace(/ !/g, '!');
        s = s.replace(/ \?/g, '?');
        s = s.replace(//g, ' ');
        
        return(s);
    }

    function modificari(a, b) {

        const lines1 = a.split(/\r?\n/);
        const lines2 = b.split(/\r?\n/);

        m = '';
        let c = 1;
        for (let i = 0; i < lines1.length; i++) {
            if (lines1[i] !== lines2[i]) {
                c = c + 1;
                m = m + " - Linia " + i + '. -\n';
                m = m + lines1[i] + '\n';
                m = m + lines2[i] + '\n\n';
            }
        }

        if (c > 0) {
            console.log('Modificări la ', c, ' linii.');
        }

        return m;
    }

    </script>

    </body>
</html>
