<!DOCTYPE html>
<meta charset="utf-8">

<html>
   
    <body>
        <h2>Corectare text</h2>
        <p>
            Încarcă fișier <input type="file" id="fileInput" /><br>
            Codificări
            <select id="encoding">
                <option value=""></option>
                <option value="x-unicode20utf8">UTF-8</option>
                <option value="ibm866">IBM866</option>
                <option value="latin2">ISO-8859-2</option>
                <option value="latin3">ISO-8859-3</option>
                <option value="latin4">ISO-8859-4</option>
                <option value="iso_8859-5:1988">ISO-8859-5</option>
                <option value="iso_8859-6:1987">ISO-8859-6</option>
                <option value="sun_eu_greek">ISO-8859-7</option>
                <option value="visual">ISO-8859-8</option>
                <option value="logical">ISO-8859-8-I</option>
                <option value="latin6">ISO-8859-10</option>
                <option value="iso885913">ISO-8859-13</option>
                <option value="iso885914">ISO-8859-14</option>
                <option value="l9">ISO-8859-15</option>
                <option value="iso-8859-16">ISO-8859-16</option>
                <option value="koi8_r">KOI8-R</option>
                <option value="koi8-u">KOI8-U</option>
                <option value="x-mac-roman">macintosh</option>
                <option value="windows-874">windows-874</option>
                <option value="x-cp1250">windows-1250</option>
                <option value="x-cp1251">windows-1251</option>
                <option value="x-cp1252">windows-1252</option>
                <option value="x-cp1253">windows-1253</option>
                <option value="x-cp1254">windows-1254</option>
                <option value="x-cp1255">windows-1255</option>
                <option value="x-cp1256">windows-1256</option>
                <option value="x-cp1257">windows-1257</option>
                <option value="x-cp1258">windows-1258</option>
                <option value="x-mac-ukrainian">x-mac-cyrillic</option>
                <option value="x-gbk">GBK</option>
                <option value="gb18030">gb18030</option>
                <option value="x-x-big5">Big5</option>
                <option value="x-euc-jp">EUC-JP</option>
                <option value="iso-2022-jp">ISO-2022-JP</option>
                <option value="x-sjis">Shift_JIS</option>
                <option value="windows-949">EUC-KR</option>
                <option value="replacement">replacement</option>
                <option value="utf-16be">UTF-16BE</option>
                <option value="utf-16le">UTF-16LE</option>
                <option value="x-user-defined">x-user-defined</option>
            </select>
        </p>
        <p>Introducere text 
        <textarea id="introdus" rows="12" maxRows="44" placeholder="Introducere text…" style="width:94%;"></textarea></p>
        <button type="button" onclick="corectare()">Corectează</button>
        <p>Textul corectat
        <textarea id="corectat" rows="12" maxRows="44" placeholder="Textul corectat…" style="width:94%;"></textarea></p>
        <button onclick="downloadFile()">Descarcă fișier</button>  
        <p>Modificări
        <textarea id="modificari" rows="9" maxRows="44" placeholder="Modificări" style="width:94%;"></textarea>  </p>
      
    <script>
    
    function corectare(text) {
        if (!text) {
            text = document.getElementById("introdus").value;
            textcorectat = diacritice(text);
            document.getElementById("corectat").value = textcorectat;
            document.getElementById("modificari").value = modificari(text, textcorectat);
        }
    }
    
    function diacritice(s) {
        
        s = s.trim();
        while (s.includes('  ')) {
            s = s.replace(/  /g, ' ');
        }
        
        s = s.replace(/ \n/g, '\n');
        
        s = s.replace(/Ã/g, 'Ă');
        s = s.replace(/ã/g, 'ă');
        s = s.replace(/ª/g, 'Ș');
        s = s.replace(/º/g, 'ș');
        s = s.replace(/Þ/g, 'Ț');
        s = s.replace(/þ/g, 'ț');
        
        s = s.replace(/\u00c3/g, 'Ă');
        s = s.replace(/\u00e3/g, 'ă');
        s = s.replace(/\u015e/g, 'Ș');
        s = s.replace(/\u015f/g, 'ș');
        s = s.replace(/\u0162/g, 'Ț');
        s = s.replace(/\u0163/g, 'ț');
        
        s = s.replace(/  /g, ' ');
        s = s.replace(/\.{3}/g, '…');
        s = s.replace(/ \./g, '.');
        s = s.replace(/ :/g, ':');
        s = s.replace(/ ,/g, ',');
        s = s.replace(/ ;/g, ';');
        s = s.replace(/ !/g, '!');
        s = s.replace(/ \?/g, '?');
        s = s.replace(//g, ' ');
        
        return(s);
    }

    function modificari(a, b) {

        const lines1 = a.split(/\r?\n/);
        const lines2 = b.split(/\r?\n/);

        m = '';
        let c = 0;
        for (let i = 0; i < lines1.length; i++) {
            if (lines1[i] !== lines2[i]) {
                c = c + 1;
                l = i + 1
                m = m + " - Linia " + l + '. -\n';
                m = m + lines1[i] + '\n';
                m = m + lines2[i] + '\n\n';
            }
        }

        if (c > 0) {
            m = m + 'Modificări la ' + c + ' linii.';
        }

        return m;
    }

    </script>

    <script>
        document.getElementById('fileInput')
            .addEventListener('change', (event) => {
                const file = event.target.files[0];
                const filename = file.name;
                const reader = new FileReader();

                reader.onload = function () {
                    const content = reader.result;
                    console.log(content);
                    document.getElementById("introdus").value = content + filename;
                };

                reader.onerror = function () {
                    console.error('Error reading the file');
                };

                encoding = document.getElementById("encoding").value
                reader.readAsText(file, encoding);
                localStorage.setItem("filename", filename);
            });
    </script>

    <script>
        const downloadFile = () => {
            const link = document.createElement("a");
            const content = document.getElementById("corectat").value;
         
            if (!content.trim()) {
                // alert("Please enter some content!");
                return;
            }
         
            const file = new Blob([content], { type: 'text/plain' });
            link.href = URL.createObjectURL(file);
            name = localStorage.getItem("filename")
            link.download = name;
            link.click();
            URL.revokeObjectURL(link.href);
        };
    </script>
    </body>
</html>
